<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Pulse - Personal Finance Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080c14;color:#b8c0cc;font-family:'Outfit',sans-serif;min-height:100vh}
.m{font-family:'JetBrains Mono',monospace}

/* Header */
.hd{background:linear-gradient(135deg,#0c1220 0%,#121a2e 100%);border-bottom:1px solid #1a2236;padding:18px 24px}
.hi{max-width:1260px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.lg{font-size:24px;font-weight:700;color:#eef1f6;letter-spacing:-0.5px}
.lg em{color:#38bdf8;font-style:normal}
.sb{font-size:11px;color:#4a5568;margin-top:3px}
.ha{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Buttons */
.b{padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;border:none;transition:all .2s;font-family:inherit}
.bp{background:#38bdf8;color:#080c14}.bp:hover{background:#0ea5e9}
.bo{background:transparent;border:1px solid #1a2236;color:#8896ab}.bo:hover{border-color:#38bdf8;color:#b8c0cc}
.bd{background:transparent;border:1px solid #ef444433;color:#ef4444}.bd:hover{background:#ef444411}
.bi{background:linear-gradient(135deg,#0ea5e9,#8b5cf6);color:#fff;padding:10px 20px}

/* Layout */
.cn{max-width:1260px;margin:0 auto;padding:16px 24px 60px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:768px){.g2{grid-template-columns:1fr}}

/* Cards */
.c{background:#0f1524;border:1px solid #1a2236;border-radius:10px;padding:16px}
.ct{font-size:13px;font-weight:600;color:#eef1f6;margin-bottom:12px}

/* KPI */
.kl{font-size:10px;color:#4a5568;text-transform:uppercase;letter-spacing:1.2px;font-weight:600;margin-bottom:3px}
.kv{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace}
.ks{font-size:10px;color:#3d4a5c;margin-top:2px}

/* Tabs */
.ts{display:flex;gap:3px;margin-bottom:16px}
.t{padding:7px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:#4a5568;font-family:inherit;transition:all .15s}
.t.on{background:#38bdf822;color:#38bdf8}
.t:hover:not(.on){color:#8896ab}

/* Filters */
.fl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.fl select,.fl input{padding:6px 12px;border-radius:6px;background:#151d30;color:#b8c0cc;border:1px solid #1a2236;font-size:12px;font-family:inherit;cursor:pointer}

/* Table */
.tw{overflow-x:auto;max-height:600px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead{position:sticky;top:0;background:#0f1524;z-index:1}
th{text-align:left;padding:9px 12px;color:#4a5568;font-weight:500;border-bottom:1px solid #1a2236;font-size:11px}
th.r{text-align:right}
td{padding:7px 12px;border-bottom:1px solid #1a223611}
td.r{text-align:right}
tr:hover td{background:#ffffff03}

/* Tags */
.tg{font-size:10px;padding:2px 8px;border-radius:4px;font-weight:500;display:inline-block;cursor:pointer}
.ts2{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:500}

/* Bar chart rows */
.br{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.bl{width:140px;font-size:11px;color:#8896ab;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{flex:1;height:18px;background:#151d30;border-radius:4px;overflow:hidden}
.bf{height:100%;border-radius:4px;transition:width .5s}
.ba{width:85px;font-size:11px;font-family:'JetBrains Mono',monospace;color:#eef1f6;text-align:right;flex-shrink:0}
.bp2{width:42px;font-size:10px;color:#4a5568;text-align:right;flex-shrink:0}

/* Monthly chart */
.mc{display:flex;align-items:flex-end;gap:6px;height:175px;padding-top:10px}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:flex-end}
.mb{width:100%;border-radius:3px 3px 0 0;min-height:1px;transition:height .5s}
.ml2{font-size:9px;color:#4a5568;margin-top:4px;white-space:nowrap}

/* Toast */
.toast{background:#0c1f16;border:1px solid #22c55e33;border-radius:10px;padding:14px;margin:12px auto;max-width:1260px}
.toastt{font-weight:600;color:#4ade80;font-size:13px;margin-bottom:6px}

/* Empty */
.empty{text-align:center;padding:80px 24px}
.empty h2{color:#eef1f6;font-weight:600;font-size:20px}
.empty p{color:#4a5568;font-size:14px;max-width:440px;margin:12px auto 0}

/* Insight box */
.ib{background:#0f1524;border:1px solid #1a2236;border-radius:10px;padding:18px;font-size:13px;line-height:1.7;color:#8896ab;white-space:pre-wrap}
.ib strong{color:#38bdf8}

.cs{padding:2px 6px;border-radius:4px;background:#151d30;color:#b8c0cc;border:1px solid #1a2236;font-size:11px;font-family:inherit}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="hd"><div class="hi">
<div><div class="lg"><em>&#8383;</em>udget Pulse</div><div class="sb" id="sub">Loading...</div></div>
<div class="ha">
<label class="b bp" id="ubtn">Upload Statements<input type="file" id="fi" multiple accept=".csv,.xls,.xlsx,.pdf"></label>
<button class="b bo" onclick="exportCSV()">Export CSV</button>
<button class="b bd" onclick="resetAll()">Reset</button>
</div>
</div></div>
<div id="toast" style="padding:0 24px"></div>
<div class="cn" id="app"></div>
<script>
var SEED=[];
var HOLDINGS={"fx_rate": 1.38, "as_of": "Not yet updated", "accounts": []};

// ─── CATEGORY RULES ───
var CRULES=[
// ─── Add your custom rules here ───
// [/MERCHANT NAME/i, "Category"],

// ─── Built-in rules (Canadian banks/merchants) ───
[/LOBLAWS|FARM BOY|FOOD BASICS|METRO |FRESHCO|NOFRILLS|SOBEYS|GROCERY|T&T|LONGOS|COSTCO|WAL-MART|WALMART/i,"Groceries"],
[/UBER EATS|SKIP ?THE ?DISH|DOORDASH|GRUBHUB/i,"Food Delivery"],
[/UBER TRIP|LYFT|TAXI/i,"Rideshare"],
[/PRESTO|GO TRANSIT|TTC |UP EXPRESS|VIARAIL|METROLINX/i,"Transit"],
[/SHOPPERS|REXALL|PHARMACY|DRUG MART/i,"Health & Pharmacy"],
[/SHELL |PETRO-CANADA|PIONEER |ESSO |ULTRAMAR|CANADIAN TIRE GAS/i,"Gas & Fuel"],
[/407 ETR|MTO TSD/i,"Auto & Tolls"],
[/AMAZON|AMZN/i,"Amazon"],
[/BELL MOBILITY|ROGERS|FIDO|TELUS|KOODO/i,"Telecom"],
[/NETFLIX|SPOTIFY|APPLE\.COM|DISNEY|OPENAI|CHATGPT/i,"Subscriptions"],
[/GYM|FITNESS|CROSSFIT|GOODLIFE|FIT4LESS/i,"Fitness"],
[/SPA|THERMEA/i,"Wellness & Spa"],
[/RESTAURANT|PIZZA|SUSHI|BAR |PUB |CAFE|TAVERN|MCDONALD/i,"Dining & Entertainment"],
[/STARBUCKS|TIM HORTON|SECOND CUP/i,"Coffee & Cafes"],
[/LCBO|WINE RACK|BEER STORE/i,"Alcohol & Liquor"],
[/AIRCANADA|WESTJET|PORTER|EXPEDIA|BOOKING|AIRBNB|HOTEL|MARRIOTT|HILTON/i,"Travel"],
[/PETRO|PET VALU|VETERINAR/i,"Pets"],
[/INTUIT|TURBOTAX/i,"Tax & Filing"],
[/INSUR/i,"Insurance"],
[/WS INVESTMENTS|WEALTHSIMPLE|TD DIRECT|TD WATERHOUSE/i,"Investments"],
[/INTERAC ETRNSFR SENT|INTERAC e-Transfer Sent/i,"E-Transfers Sent"],
[/PAYROLL|SALARY|DIR DEP|DIRECT DEPOSIT/i,"Employment Income"]
];
var PPAT=[/PAYMENT RECEIVED/i,/TRSF FROM\/DE ACCT/i,/\[CW\]AMEX CARDS/i,/\[CW\] TF 000\d+/i,/Online Bill Payment, AMEX CARDS/i,/Online Transfer, TF 000/i,/Online Bill Payment, TD WATERHSE/i];
var CC={"Internet":"#0ea5e9","Amazon":"#ff9900","Utilities":"#06b6d4","Home Insurance":"#8b5cf6","Car Insurance":"#d946ef","Groceries":"#2d9d5a","Food Delivery":"#e67e22","Rideshare":"#e67e22","Transit":"#3498db","Health & Pharmacy":"#e74c3c","Gas & Fuel":"#8e44ad","Auto & Tolls":"#d35400","Shopping":"#3498db","Telecom":"#1abc9c","Subscriptions":"#9b59b6","Fitness":"#e91e63","Wellness & Spa":"#00bcd4","Dining & Entertainment":"#f39c12","Coffee & Cafes":"#a0522d","Alcohol & Liquor":"#c0392b","Travel":"#ff5722","Grooming":"#607d8b","Hair Care":"#8e44ad","Dry Cleaning":"#95a5a6","Pets":"#795548","Tax & Filing":"#009688","Donations":"#27ae60","Professional Fees":"#607d8b","Insurance":"#795548","Investments":"#4caf50","E-Transfers Sent":"#ff9800","Employment Income":"#2ecc71","Transfers Received":"#27ae60","Government / Tax":"#009688","Entertainment":"#ff6b6b","Rent / Housing":"#c0392b","Misc Purchases":"#95a5a6","ATM & Fees":"#bdc3c7","Cycling":"#2196f3","Uncategorized":"#7f8c8d"};
var ALLC=Object.keys(CC);
var MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// ─── HELPERS ───
function cat(d){
  var cr=loadRules();
  for(var i=0;i<cr.length;i++){try{if(new RegExp(cr[i].pattern,"i").test(d))return cr[i].category}catch(e){}}
  for(var j=0;j<CRULES.length;j++){if(CRULES[j][0].test(d))return CRULES[j][1]}
  return"Uncategorized";
}
function isPay(d){return PPAT.some(function(p){return p.test(d)})}
function tk(t){return t.date+"|"+t.description.trim().slice(0,40)+"|"+t.amount.toFixed(2)+"|"+t.source}
function fm(n){return"$"+n.toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2})}
function mk(d){return d.slice(0,7)}
function fmk(k){var p=k.split("-");return MN[parseInt(p[1])-1]+" "+p[0]}
function loadRules(){try{var s=localStorage.getItem("bp7-rules");return s?JSON.parse(s):[]}catch(e){return[]}}
function saveRules(r){try{localStorage.setItem("bp7-rules",JSON.stringify(r))}catch(e){}}
function addRule(p,c){var r=loadRules();if(!r.some(function(x){return x.pattern===p})){r.push({pattern:p,category:c});saveRules(r)}}
function removeRule(i){var r=loadRules();r.splice(i,1);saveRules(r)}
function getMerchantKey(d){
  var s=d.trim().replace(/\s{2,}.*$/,"").replace(/\s+\d{3,}.*$/,"").replace(/\s+#\d+.*$/,"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return s.trim();
}
function loadCustomCats(){
  try{var s=localStorage.getItem("bp7-cats");if(s){var c=JSON.parse(s);for(var k in c){CC[k]=c[k];if(ALLC.indexOf(k)===-1)ALLC.push(k)}}}catch(e){}
}
function saveCustomCats(){try{var o={};for(var k in CC)o[k]=CC[k];localStorage.setItem("bp7-cats",JSON.stringify(o))}catch(e){}}

// ─── STATE ───
var T=[],view="overview",sMo="all",sSrc="all",sTyp="all",sCat="all",eIdx=null,sQ="",expCat=null;
var BUDGETS={};
function loadBudgets(){try{var s=localStorage.getItem("bp7-bud");if(s)BUDGETS=JSON.parse(s)}catch(e){}}
function saveBudgets(){try{localStorage.setItem("bp7-bud",JSON.stringify(BUDGETS))}catch(e){}}
function setBudget(cat,val){if(val&&!isNaN(val)&&val>0)BUDGETS[cat]=parseFloat(val);else delete BUDGETS[cat];saveBudgets();render()}

var FCST={};
function loadFcst(){try{var s=localStorage.getItem("bp7-fc");if(s)FCST=JSON.parse(s)}catch(e){}}
function saveFcst(){try{localStorage.setItem("bp7-fc",JSON.stringify(FCST))}catch(e){}}

var MBUD={};
function loadMbud(){try{var s=localStorage.getItem("bp7-mbud");if(s)MBUD=JSON.parse(s)}catch(e){}}
function saveMbud(){try{localStorage.setItem("bp7-mbud",JSON.stringify(MBUD))}catch(e){}}
function setMbud(mKey,cat,val){
  if(!MBUD[mKey])MBUD[mKey]={};
  if(val&&!isNaN(val)&&parseFloat(val)>=0)MBUD[mKey][cat]=parseFloat(val);
  else delete MBUD[mKey][cat];
  if(Object.keys(MBUD[mKey]).length===0)delete MBUD[mKey];
  saveMbud();render();
}
function setFcst(mKey,field,val){
  if(!FCST[mKey])FCST[mKey]={};
  if(val&&!isNaN(val)&&parseFloat(val)>=0)FCST[mKey][field]=parseFloat(val);
  else delete FCST[mKey][field];
  if(Object.keys(FCST[mKey]).length===0)delete FCST[mKey];
  saveFcst();render();
}

function load(){
  try{var s=localStorage.getItem("bp7-tx");if(s)T=JSON.parse(s);else{T=SEED;save()}}catch(e){T=SEED;save()}
  // Auto-fix investments
  var f=false;
  var ip=/WS INVESTMENTS|WEALTHSIMPLE|TD DIRECT|TD WATERHOUSE|TD WATERHSE|TD INVESTMENT/i;
  for(var i=0;i<T.length;i++){
    if(T[i].category==="Investments"&&T[i].type!=="Investment"){T[i].type="Investment";f=true}
    if(ip.test(T[i].description)&&T[i].type!=="Investment"){T[i].type="Investment";T[i].category="Investments";f=true}
  }
  if(f)save();
}
function save(){try{localStorage.setItem("bp7-tx",JSON.stringify(T))}catch(e){}}

// ─── Holdings Storage ───
function loadHoldings(){
  try{var s=localStorage.getItem("bp7-hold");if(s)return JSON.parse(s)}catch(e){}
  return HOLDINGS;
}

var livePrices={};
var livePrevClose={};
var liveFX=null;
var priceLoading=false;

function getFinnhubKey(){
  return localStorage.getItem("bp7-fhkey")||"";
}
function setFinnhubKey(){
  var k=prompt("Enter your free Finnhub API key (get one at finnhub.io/register):",getFinnhubKey());
  if(k&&k.trim()){localStorage.setItem("bp7-fhkey",k.trim());
    document.getElementById("toast").innerHTML='<div class="toast"><div class="toastt" style="color:#4ade80">API Key Saved</div><div style="font-size:12px;color:#8896ab">Click Refresh to fetch prices</div><button class="b bo" style="margin-top:8px;font-size:11px" onclick="document.getElementById(\'toast\').innerHTML=\'\'">OK</button></div>';
  }
}

async function fetchLivePrices(){
  if(priceLoading)return;
  priceLoading=true;render();
  document.getElementById("toast").innerHTML='<div class="toast"><div class="toastt">Fetching live prices...</div><div style="font-size:12px;color:#8896ab">Updating stock prices and FX rate via Finnhub</div></div>';
  var H=loadHoldings();
  var apiKey=getFinnhubKey();
  if(!apiKey){
    priceLoading=false;
    var k=prompt("To fetch live stock prices, you need a free Finnhub API key.\n\n1. Go to finnhub.io/register (opens after this)\n2. Sign up (takes 30 seconds)\n3. Copy your API key from the dashboard\n4. Paste it below:\n\nAPI Key:");
    if(k&&k.trim()){
      localStorage.setItem("bp7-fhkey",k.trim());
      apiKey=k.trim();
    }else{
      window.open("https://finnhub.io/register","_blank");
      document.getElementById("toast").innerHTML='<div class="toast"><div class="toastt" style="color:#fbbf24">API Key Required</div><div style="font-size:12px;color:#8896ab">Sign up at <a href="https://finnhub.io/register" target="_blank" style="color:#38bdf8">finnhub.io/register</a>, copy your key, then click \u21bb Refresh again</div><button class="b bo" style="margin-top:8px;font-size:11px" onclick="document.getElementById(\'toast\').innerHTML=\'\'">OK</button></div>';
      return;
    }
  }
  var symMap={};
  // Finnhub free tier only supports US exchanges. Skip CAD-only ETFs.
  var cadOnly={"ZAG":1,"ZCB":1,"ZHY":1,"ZEA":1,"QCN":1,"QUU":1,"GRN":1,"ZUAG.F":1,"GSWO":1};
  var totalMVusd=0,totalMVcadOnly=0;
  H.accounts.forEach(function(a){a.holdings.forEach(function(p){
    if(cadOnly[p.symbol]){totalMVcadOnly+=p.market*(a.currency==="USD"?(H.fx_rate||1.38):1)}
    else if(!p.symbol.includes(".")){symMap[p.symbol]=p.symbol;totalMVusd+=p.market*(a.currency==="USD"?(H.fx_rate||1.38):1)}
  })});
  // Always fetch SPY for S&P 500 benchmark chart
  symMap["SPY"]="SPY";
  var fetched=0,failed=0,failedSyms=[];
  var entries=Object.entries(symMap);
  var total=entries.length;
  for(var si=0;si<entries.length;si++){
    var finnSym=entries[si][0],origSym=entries[si][1];
    document.getElementById("toast").innerHTML='<div class="toast"><div class="toastt">Fetching prices... '+(si+1)+'/'+total+'</div><div style="font-size:12px;color:#8896ab">'+finnSym+'</div></div>';
    try{
      var r=await fetch("https://finnhub.io/api/v1/quote?symbol="+finnSym+"&token="+apiKey);
      if(r.ok){
        var d=await r.json();
        if(d.c&&d.c>0){livePrices[origSym]=d.c;if(d.pc)livePrevClose[origSym]=d.pc;fetched++}
        else{failed++;failedSyms.push(origSym)}
      }else{failed++;failedSyms.push(origSym)}
    }catch(e){failed++;failedSyms.push(origSym)}
    if(si<entries.length-1)await new Promise(function(r){setTimeout(r,150)});
  }
  // FX rate — ExchangeRate-API (free, no key, CORS enabled), then Finnhub fallback
  liveFX=null;
  var fxApis=[
    {name:"ExchangeRate-API",url:"https://open.exchangerate-api.com/v6/latest/USD",parse:function(d){return(d.rates&&d.rates.CAD)?d.rates.CAD:null}},
    {name:"currency-exchang",url:"https://currency-exchang.up.railway.app/rates?base=USD",parse:function(d){return(d.rates&&d.rates.CAD)?d.rates.CAD:null}},
    {name:"Finnhub",url:"https://finnhub.io/api/v1/forex/rates?base=USD&token="+apiKey,parse:function(d){return(d.quote&&d.quote.CAD)?d.quote.CAD:null}}
  ];
  for(var fxi=0;fxi<fxApis.length&&!liveFX;fxi++){
    try{
      var fxr=await fetch(fxApis[fxi].url);
      if(fxr.ok){
        var fxd=await fxr.json();
        var rate=fxApis[fxi].parse(fxd);
        if(rate&&rate>1.2&&rate<1.6){liveFX=rate;console.log("FX from "+fxApis[fxi].name+":",liveFX)}
      }else{console.log("FX "+fxApis[fxi].name+" HTTP "+fxr.status)}
    }catch(e){console.log("FX "+fxApis[fxi].name+" failed:",e.message)}
  }
  if(liveFX){console.log("Final FX rate:",liveFX)}
  else{console.log("All FX sources failed — keeping previous rate")}
  if(liveFX)H.fx_rate=liveFX;
  var updCount=0;
  H.accounts.forEach(function(a){
    a.holdings.forEach(function(p){
      if(livePrices[p.symbol]!==undefined){
        console.log("Updating",p.symbol,"price:",p.price,"->",livePrices[p.symbol]);
        p.price=livePrices[p.symbol];
        updCount++;
      }
      p.market=p.qty*p.price;
    });
    a.total_market=a.holdings.reduce(function(s,p){return s+p.market},0)+a.cash;
    console.log("Account",a.account,"total_market:",a.total_market);
  });
  console.log("Updated",updCount,"position prices across accounts");
  H.as_of=new Date().toISOString().slice(0,10)+" "+new Date().toLocaleTimeString();
  if(fetched>0){
    try{localStorage.setItem("bp7-hold",JSON.stringify(H))}catch(e){}
    // Save portfolio snapshot for chart history
    var snapTotal=0;
    H.accounts.forEach(function(a){snapTotal+=a.total_market*(a.currency==="USD"?(H.fx_rate||1.3822):1)});
    saveSnapshot(snapTotal,H.fx_rate||1.3822,livePrices["SPY"]||livePrices["VOO"]||null);
    console.log("Saved snapshot: $"+snapTotal.toFixed(2)+" CAD, SPY:"+(livePrices["SPY"]||"n/a"));
    // Refresh chart with new data
    if(view==="investments")fetchPortfolioHistory(portfolioChart.range);
  }
  priceLoading=false;render();
  var msg=fetched+" symbols updated";
  if(failed>0)msg+=" ("+failed+" failed: "+failedSyms.join(", ")+")";
  if(liveFX)msg+=" \u00b7 USD/CAD: "+liveFX.toFixed(4);
  else msg+=" \u00b7 FX: unchanged";
  var cadSkipped=Object.keys(cadOnly).length;
  var covPct=totalMVusd>0?((totalMVusd/(totalMVusd+totalMVcadOnly))*100).toFixed(0):"100";
  document.getElementById("toast").innerHTML='<div class="toast"><div class="toastt" style="color:'+(failed>fetched?"#fbbf24":"#4ade80")+'">Prices Updated</div><div style="font-size:12px;color:#8896ab">'+msg+'</div><div style="font-size:10px;color:#4a5568;margin-top:4px">'+cadSkipped+' CAD-only ETFs at seed prices (Finnhub free = US exchanges only)</div>'+(failed>fetched?'<div style="font-size:10px;color:#4a5568;margin-top:4px">If all failed, click \u2699 to update your <a href="https://finnhub.io/register" target="_blank" style="color:#38bdf8">Finnhub API key</a></div>':'')+'<button class="b bo" style="margin-top:8px;font-size:11px" onclick="document.getElementById(\'toast\').innerHTML=\'\'">OK</button></div>';
}
function saveHoldings(h){try{localStorage.setItem("bp7-hold",JSON.stringify(h))}catch(e){}}

var portfolioChart={range:"1M",data:null,loading:false};

// Portfolio history: snapshot-based approach (free tier doesn't support candle endpoint)
var SNAP_KEY="bp7-snap";
function loadSnapshots(){try{var s=localStorage.getItem(SNAP_KEY);return s?JSON.parse(s):[]}catch(e){return[]}}
function saveSnapshot(val,fxr,spy){
  var snaps=loadSnapshots();
  var now=new Date();
  var dateKey=now.toISOString().slice(0,10);
  var snap={t:now.getTime(),v:val,fx:fxr,d:dateKey};
  if(spy)snap.spy=spy;
  snaps.push(snap);
  if(snaps.length>8760)snaps=snaps.slice(-8760);
  try{localStorage.setItem(SNAP_KEY,JSON.stringify(snaps))}catch(e){}
}

function fetchPortfolioHistory(range){
  portfolioChart.range=range;
  var snaps=loadSnapshots();
  if(snaps.length<2){
    portfolioChart.data=null;render();
    document.getElementById("toast").innerHTML='<div class="toast"><div class="toastt" style="color:#38bdf8">Building History</div><div style="font-size:12px;color:#8896ab">Portfolio chart builds over time from your Refresh clicks. You have '+snaps.length+' snapshot'+(snaps.length!==1?'s':'')+' so far — need at least 2.</div><div style="font-size:10px;color:#4a5568;margin-top:4px">Each time you Refresh Live Prices, a snapshot is saved. After a few sessions you\'ll see the chart populate.</div><button class="b bo" style="margin-top:8px;font-size:11px" onclick="document.getElementById(\'toast\').innerHTML=\'\'">OK</button></div>';
    return;
  }
  var now=Date.now();
  var cutoff;
  if(range==="1D")cutoff=now-86400000;
  else if(range==="1W")cutoff=now-7*86400000;
  else if(range==="1M")cutoff=now-30*86400000;
  else if(range==="YTD"){var jan1=new Date(new Date().getFullYear(),0,1);cutoff=jan1.getTime()}
  else cutoff=now-365*86400000;

  var filtered=snaps.filter(function(s){return s.t>=cutoff});
  var chartSnaps;
  if(range==="1D"||range==="1W"){
    // Show all snapshots for short timeframes (no dedup)
    chartSnaps=filtered.sort(function(a,b){return a.t-b.t});
  }else{
    // Deduplicate to one per day for longer timeframes — prefer snapshots with SPY data
    var byDay={};
    filtered.forEach(function(s){
      if(!byDay[s.d]||s.spy||!byDay[s.d].spy)byDay[s.d]=s;
    });
    chartSnaps=Object.values(byDay).sort(function(a,b){return a.t-b.t});
  }

  if(chartSnaps.length<2){
    render();
    document.getElementById("toast").innerHTML='<div class="toast"><div class="toastt" style="color:#fbbf24">Not enough data for '+range+'</div><div style="font-size:12px;color:#8896ab">You have '+filtered.length+' snapshot'+(filtered.length!==1?'s':'')+' in this range. Showing previous view.</div><button class="b bo" style="margin-top:8px;font-size:11px" onclick="document.getElementById(\'toast\').innerHTML=\'\'">OK</button></div>';
    return;
  }
  portfolioChart.data=chartSnaps.map(function(s){return{t:s.t,v:s.v,spy:s.spy||null}}).sort(function(a,b){return a.t-b.t});
  console.log("Chart data: "+portfolioChart.data.length+" points, range="+range+", first=$"+portfolioChart.data[0].v.toFixed(0)+" last=$"+portfolioChart.data[portfolioChart.data.length-1].v.toFixed(0));
  render();
}

function addHolding(){
  var acctIdx=parseInt(document.getElementById("ah-acct").value);
  var sym=document.getElementById("ah-sym").value.trim().toUpperCase();
  var qty=parseFloat(document.getElementById("ah-qty").value);
  var price=parseFloat(document.getElementById("ah-price").value);
  var book=parseFloat(document.getElementById("ah-book").value);
  var name=document.getElementById("ah-name").value.trim()||sym;
  if(!sym||isNaN(qty)||isNaN(price)||qty<=0||price<=0){alert("Fill in symbol, shares, and current price.");return}
  if(isNaN(book))book=price; // Default book to current price if not provided
  var H=loadHoldings();
  var acct=H.accounts[acctIdx];
  if(!acct){alert("Invalid account.");return}
  // Check if symbol already exists in account
  var existing=acct.holdings.find(function(h2){return h2.symbol===sym});
  if(existing){
    // Add to existing position
    var oldQty=existing.qty;
    existing.qty+=qty;
    existing.book=((existing.book*oldQty)+(book*qty))/(existing.qty); // weighted avg book
    existing.price=price;
    existing.market=existing.qty*existing.price;
  }else{
    acct.holdings.push({symbol:sym,name:name,qty:qty,price:price,book:book*qty,market:qty*price});
  }
  acct.total_market=acct.holdings.reduce(function(s,p){return s+p.market},0)+acct.cash;
  acct.total_book=acct.holdings.reduce(function(s,p){return s+p.book},0);
  saveHoldings(H);render();
  document.getElementById("toast").innerHTML='<div class="toast"><div class="toastt" style="color:#4ade80">Position Added</div><div style="font-size:12px;color:#8896ab">'+qty+' x '+sym+' @ $'+price.toFixed(2)+' added to '+acct.name+'</div><button class="b bo" style="margin-top:8px;font-size:11px" onclick="document.getElementById(\'toast\').innerHTML=\'\'">OK</button></div>';
}

// ─── FILE DETECTION & PARSING ───
function detectSrc(c,fn){
  var f=(fn||"").toLowerCase(),t=typeof c==="string"?c:"";
  if(t.includes("American Express")||t.includes("Cobalt")||t.includes("Bonvoy"))return"Amex";
  if(t.includes("Transaction Type")&&t.includes("First Bank Card"))return"BMO Chequing";
  if(t.includes("Item #")&&t.includes("Card #")&&t.includes("Transaction Date"))return"Mastercard";
  if(/amex|summary/i.test(f))return"Amex";
  if(/mastercard|mc/i.test(f))return"Mastercard";
  if(/chequing|bmo|statement/i.test(f))return"BMO Chequing";
  return null;
}

function detectAmexCard(wb){
  var sh=wb.Sheets[wb.SheetNames[0]];
  var raw=XLSX.utils.sheet_to_json(sh,{header:1});
  for(var i=0;i<Math.min(5,raw.length);i++){
    var row=String(raw[i]||"");
    if(/Cobalt/i.test(row))return"Amex Cobalt";
    if(/Bonvoy|Marriott/i.test(row))return"Amex Bonvoy";
  }
  return"Amex";
}

function parseAmex(wb){
  var cardName=detectAmexCard(wb);
  var sh=wb.Sheets[wb.SheetNames[0]];
  var raw=XLSX.utils.sheet_to_json(sh,{header:1});
  var hi=raw.findIndex(function(r){return r[0]==="Date"&&r[1]==="Date Processed"});
  if(hi===-1)hi=raw.findIndex(function(r){return String(r[0]||"").includes("Date")});
  if(hi===-1)return[];
  var out=[];
  for(var i=hi+1;i<raw.length;i++){
    var row=raw[i];if(!row[0])continue;
    var desc=String(row[2]||"").trim();
    var as=String(row[3]||"0").replace(/[$,]/g,"");
    var amt=parseFloat(as);if(isNaN(amt))continue;
    var ds=String(row[0]).trim();
    var m=ds.match(/(\d{1,2})\s+(\w+\.?)\s+(\d{4})/);
    if(!m)continue;
    var dt=new Date(m[2].replace(".","")+" "+m[1]+", "+m[3]);
    if(isNaN(dt.getTime()))continue;
    if(isPay(desc))continue;
    var c=cat(desc);
    out.push({date:dt.toISOString().slice(0,10),description:desc,amount:Math.abs(amt),type:c==="Investments"?"Investment":(amt<0?"Income":"Expense"),source:cardName,category:c});
  }
  return out;
}

function parseBMO(text){
  var lines=text.split("\n").filter(function(l){return l.trim()});
  var hi=lines.findIndex(function(l){return l.includes("First Bank Card")&&l.includes("Transaction Type")});
  if(hi===-1)return[];
  var out=[];
  for(var i=hi+1;i<lines.length;i++){
    var line=lines[i].trim();if(!line)continue;
    var p=Papa.parse(line,{header:false});
    if(!p.data||!p.data[0]||p.data[0].length<5)continue;
    var row=p.data[0],desc=String(row[4]||"").trim();
    var tt=String(row[1]||"").trim().toUpperCase();
    var amt=parseFloat(row[3]);if(isNaN(amt))continue;
    var ds=String(row[2]).replace(/'/g,"").trim();
    if(ds.length<8)continue;
    var dt=new Date(ds.slice(0,4)+"-"+ds.slice(4,6)+"-"+ds.slice(6,8));
    if(isNaN(dt.getTime()))continue;
    if(isPay(desc))continue;
    var c=cat(desc);
    out.push({date:dt.toISOString().slice(0,10),description:desc,amount:Math.abs(amt),type:c==="Investments"?"Investment":(tt==="CREDIT"?"Income":"Expense"),source:"BMO Chequing",category:c});
  }
  return out;
}

function parseMastercard(text){
  var lines=text.split("\n").filter(function(l){return l.trim()});
  // Find header row: Item #,Card #,Transaction Date,Posting Date,Transaction Amount,Description
  var hi=lines.findIndex(function(l){return l.includes("Item #")&&l.includes("Card #")&&l.includes("Transaction Date")});
  if(hi===-1)return[];
  var out=[];
  for(var i=hi+1;i<lines.length;i++){
    var line=lines[i].trim();if(!line)continue;
    var p=Papa.parse(line,{header:false});
    if(!p.data||!p.data[0]||p.data[0].length<6)continue;
    var row=p.data[0];
    var desc=String(row[5]||"").trim();
    var amt=parseFloat(row[4]);if(isNaN(amt))continue;
    var ds=String(row[2]).replace(/'/g,"").trim();
    if(ds.length<8)continue;
    var dt=new Date(ds.slice(0,4)+"-"+ds.slice(4,6)+"-"+ds.slice(6,8));
    if(isNaN(dt.getTime()))continue;
    if(isPay(desc))continue;
    var c=cat(desc);
    // Positive = expense, negative = credit/payment on Mastercard
    var isCredit=amt<0;
    out.push({date:dt.toISOString().slice(0,10),description:desc,amount:Math.abs(amt),type:c==="Investments"?"Investment":(isCredit?"Income":"Expense"),source:"BMO Mastercard",category:c});
  }
  return out;
}

// ─── UPLOAD ───
async function handleFiles(files){
  document.getElementById("ubtn").textContent="Processing...";
  var ek=new Set(T.map(tk)),tn=0,td=0,res=[];
  for(var fi=0;fi<files.length;fi++){
    var file=files[fi],nt=[];
    if(/\.pdf$/i.test(file.name)){res.push({f:file.name,ok:false,m:"PDF detected — upload this file to Claude to extract transactions, then re-upload the resulting CSV here"});continue}
    var isXl=/\.xls(x)?$/i.test(file.name);
    if(isXl){
      var buf=await file.arrayBuffer();
      var wb=XLSX.read(buf,{type:"array"});
      var src=detectSrc(XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]]),file.name);
      if(src==="Amex")nt=parseAmex(wb);
      else{res.push({f:file.name,ok:false,m:"Could not detect account type"});continue}
    }else{
      var text=await file.text();
      var src=detectSrc(text,file.name);
      if(src==="BMO Chequing")nt=parseBMO(text);
      else if(src==="Mastercard")nt=parseMastercard(text);
      else{res.push({f:file.name,ok:false,m:"Could not detect account type"});continue}
    }
    var du=0,ad=0;
    for(var j=0;j<nt.length;j++){
      var k=tk(nt[j]);
      if(ek.has(k)){du++}
      else{ek.add(k);T.push(nt[j]);ad++}
    }
    tn+=ad;td+=du;
    res.push({f:file.name,ok:true,src:nt[0]?nt[0].source:"?",ad:ad,du:du});
  }
  T.sort(function(a,b){return b.date.localeCompare(a.date)});
  save();
  var el=document.getElementById("toast");
  var h='<div class="toast"><div class="toastt">Upload Complete \u2014 '+tn+' new, '+td+' duplicates skipped</div>';
  for(var i=0;i<res.length;i++){
    var r=res[i];
    h+='<div style="font-size:12px;margin-top:4px;color:'+(r.ok?'#86efac':'#fca5a5')+'">'+r.f+': '+(r.ok?r.src+' \u2192 '+r.ad+' added, '+r.du+' dupes':r.m)+'</div>';
  }
  h+='<button class="b bo" style="margin-top:8px;font-size:11px" onclick="document.getElementById(\'toast\').innerHTML=\'\'">Dismiss</button></div>';
  el.innerHTML=h;
  render();
  document.getElementById("ubtn").innerHTML='Upload Statements<input type="file" id="fi" multiple accept=".csv,.xls,.xlsx,.pdf">';
  document.getElementById("fi").addEventListener("change",function(e){handleFiles(e.target.files)});
}

// Chart hover interaction
function pcHover(evt){
  var svg=document.getElementById("pc-svg");
  if(!svg||!window._pcCoords)return;
  var pts=window._pcCoords;
  // Use SVG's own coordinate system for accurate positioning
  var pt2=svg.createSVGPoint();
  pt2.x=evt.clientX;pt2.y=evt.clientY;
  var svgPt=pt2.matrixTransform(svg.getScreenCTM().inverse());
  var mouseX=svgPt.x;
  // Find closest data point by X coordinate
  var closest=0,closestDist=Infinity;
  for(var i=0;i<pts.length;i++){
    var d=Math.abs(pts[i].x-mouseX);
    if(d<closestDist){closestDist=d;closest=i}
  }
  var pt=pts[closest];
  var vline=document.getElementById("pc-vline");
  var dot=document.getElementById("pc-dot");
  var tip=document.getElementById("pc-tip");
  var tipVal=document.getElementById("pc-tip-val");
  var tipDate=document.getElementById("pc-tip-date");
  var tipChg=document.getElementById("pc-tip-chg");
  if(!vline||!dot||!tip)return;
  vline.setAttribute("x1",pt.x);vline.setAttribute("x2",pt.x);vline.setAttribute("visibility","visible");
  dot.setAttribute("cx",pt.x);dot.setAttribute("cy",pt.y);dot.setAttribute("visibility","visible");
  // SPY dot
  var dotSpy=document.getElementById("pc-dot-spy");
  if(dotSpy&&pt.spyY!==undefined){dotSpy.setAttribute("cx",pt.x);dotSpy.setAttribute("cy",pt.spyY);dotSpy.setAttribute("visibility","visible")}
  else if(dotSpy){dotSpy.setAttribute("visibility","hidden")}
  var dt=new Date(pt.t);
  var dtStr=dt.toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"})+" "+dt.toLocaleTimeString("en-CA",{hour:"2-digit",minute:"2-digit"});
  var chgFromStart=pt.v-window._pcStartV;
  var chgPct2=window._pcStartV>0?((chgFromStart/window._pcStartV)*100).toFixed(2):"0";
  var chgCol=chgFromStart>=0?"#4ade80":"#f87171";
  tipVal.textContent="$"+pt.v.toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2});
  tipDate.textContent=dtStr;
  tipChg.innerHTML='<span style="color:'+chgCol+'">Portfolio: '+(chgFromStart>=0?"+":"")+chgPct2+'%</span>';
  // SPY line in tooltip
  var tipSpy=document.getElementById("pc-tip-spy");
  if(tipSpy&&pt.spy&&window._pcSpyStart>0){
    var spyChgPct=((pt.spy/window._pcSpyStart-1)*100).toFixed(2);
    var spyCol=spyChgPct>=0?"#fbbf24":"#f87171";
    tipSpy.innerHTML='<span style="color:'+spyCol+'">S&P 500: '+(spyChgPct>=0?"+":"")+spyChgPct+'% ($'+pt.spy.toFixed(2)+')</span>';
  }else if(tipSpy){tipSpy.innerHTML=""}
  tip.style.display="block";
  // Position tooltip
  var tipPctX=(pt.x/680)*100;
  if(tipPctX>60){tip.style.right=(100-tipPctX+2)+"%";tip.style.left="auto"}
  else{tip.style.left=(tipPctX+2)+"%";tip.style.right="auto"}
}

  var idx=ALLC.indexOf(cat);if(idx>-1)ALLC.splice(idx,1);
  delete CC[cat];
  delete BUDGETS[cat];delete BUDGETS["inc:"+cat];
  saveCustomCats();saveBudgets();render();
}

        });
      }

    else{
      h+='<div class="tw"><table><thead><tr><th>Pattern</th><th>Category</th><th style="width:70px">Action</th></tr></thead><tbody>';
      rules.forEach(function(r,i){var col=CC[r.category]||"#7f8c8d";h+='<tr><td class="m" style="font-size:10px;color:#eef1f6">'+r.pattern+'</td><td><span class="tg" style="background:'+col+'22;color:'+col+'">'+r.category+'</span></td><td><button class="b bd" style="padding:3px 8px;font-size:10px" onclick="delRule('+i+')">Delete</button></td></tr>'});
      h+='</tbody></table></div>';
    }
    h+='<div style="margin-top:14px;padding-top:14px;border-top:1px solid #1a2236">';
    h+='<button class="b bo" style="font-size:11px" onclick="reapplyRules()">Re-apply All Rules</button>';
    h+='</div></div>';

    // ─── Category Manager ───
    h+='<div class="c" style="margin-top:14px"><div class="ct">Manage Categories <span style="font-size:11px;color:#4a5568;font-weight:400">('+ALLC.length+')</span></div>';
    h+='<p style="font-size:11px;color:#8896ab;margin-bottom:14px">Add new categories or delete unused ones. Deleting a category with transactions moves them to Uncategorized.</p>';
    h+='<div style="margin-bottom:14px"><button class="b bp" style="font-size:12px" onclick="addCatUI()">+ New Category</button></div>';

    // Count txns per category
    var catCounts={};T.forEach(function(t){catCounts[t.category]=(catCounts[t.category]||0)+1});

    h+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
    ALLC.slice().sort().forEach(function(c){
      var col=CC[c]||"#7f8c8d";
      var n=catCounts[c]||0;
      var isBuiltin=["Groceries","Dining & Entertainment","Rideshare","Transit","Health & Pharmacy","Gas & Fuel","Auto & Tolls","Shopping","Telecom","Subscriptions","Fitness","Wellness & Spa","Coffee & Cafes","Alcohol & Liquor","Travel","Grooming","Pets","Employment Income","Transfers Received","Rent / Housing","E-Transfers Sent","Investments","Uncategorized","Food Delivery","Entertainment","Government / Tax","ATM & Fees","Amazon","Internet","Car Insurance","Home Insurance","Utilities","Professional Fees"].indexOf(c)>-1;
      h+='<div style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:6px;background:'+col+'15;border:1px solid '+col+'33">';
      h+='<span style="font-size:11px;color:'+col+';font-weight:500">'+c+'</span>';
      h+='<span style="font-size:9px;color:#4a5568;margin-left:2px">('+n+')</span>';
      if(!isBuiltin||n===0){h+='<span style="cursor:pointer;color:#4a5568;font-size:13px;margin-left:4px;line-height:1" onclick="delCat(\''+c.replace(/'/g,"\\\'")+'\')" title="Delete category">&times;</span>'}
      h+='</div>';
    });
    h+='</div></div>';
  }

  // ═══════════════════ INSIGHTS ═══════════════════
  if(view==="insights"){
    var allExp=T.filter(function(t){return t.type==="Expense"});
    var numMoI=([...new Set(T.map(function(t){return mk(t.date)}))]).length||1;

    // Subscription Audit
    h+='<div class="c" style="margin-bottom:14px"><div class="ct">\ud83d\udd0d Subscription & Recurring Audit</div>';
    var merchMo={};
    allExp.forEach(function(t){
      var key=t.description.replace(/\s{2,}.*$/,"").replace(/\s+\d{3,}.*$/,"").replace(/\s+#\d+.*$/,"").trim().slice(0,35);
      var m=mk(t.date);
      if(!merchMo[key])merchMo[key]={months:new Set(),total:0,cat:t.category};
      merchMo[key].months.add(m);merchMo[key].total+=t.amount;
    });
    var recur=Object.entries(merchMo).filter(function(e){return e[1].months.size>=2}).map(function(e){var avg=e[1].total/e[1].months.size;return{name:e[0],months:e[1].months.size,total:e[1].total,avg:avg,ann:avg*12,cat:e[1].category}}).sort(function(a,b){return b.ann-a.ann});
    var totalRec=recur.reduce(function(s,r){return s+r.avg},0);
    h+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">';
    h+=kpi("Monthly Recurring",fm(totalRec),"#f87171",recur.length+" items");
    h+=kpi("Annualized",fm(totalRec*12),"#fb923c","projected yearly");
    var subOnly=recur.filter(function(r){return r.cat==="Subscriptions"||r.avg<50});
    h+=kpi("Subscriptions",fm(subOnly.reduce(function(s,r){return s+r.avg},0))+"/mo","#a78bfa",subOnly.length+" active");
    h+='</div>';
    if(recur.length>0){
      h+='<div class="tw"><table><thead><tr><th>Merchant</th><th>Category</th><th class="r">Months</th><th class="r">Avg/Mo</th><th class="r">Annual</th></tr></thead><tbody>';
      recur.forEach(function(r){var col=CC[r.cat]||"#7f8c8d";h+='<tr><td style="color:#eef1f6">'+r.name+(r.ann>500?' \u26a0\ufe0f':'')+'</td><td><span class="tg" style="background:'+col+'22;color:'+col+'">'+r.cat+'</span></td><td class="r" style="color:#8896ab">'+r.months+'/'+numMoI+'</td><td class="r m" style="color:#eef1f6">'+fm(r.avg)+'</td><td class="r m" style="color:#fb923c">'+fm(r.ann)+'</td></tr>'});
      h+='</tbody></table></div>';
    }
    h+='</div>';

    // Savings Tips
    h+='<div class="c" style="margin-bottom:14px"><div class="ct">\ud83d\udca1 Savings Opportunities</div>';
    var tips=[];

    var cofTxns=allExp.filter(function(t){return t.category==="Coffee & Cafes"});
    if(cofTxns.length>0){var cofMo=cofTxns.reduce(function(s,t){return s+t.amount},0)/numMoI;if(cofMo>40)tips.push({icon:"\u2615",title:"Coffee: "+fm(cofMo)+"/mo",desc:cofTxns.length+" purchases. Cutting 50% saves "+fm(cofMo*6)+"/yr.",sav:cofMo*.5})}

    var dinTxns=allExp.filter(function(t){return t.category==="Dining & Entertainment"});
    if(dinTxns.length>0){var dinMo=dinTxns.reduce(function(s,t){return s+t.amount},0)/numMoI;if(dinMo>300){var big=dinTxns.filter(function(t){return t.amount>75}).sort(function(a,b){return b.amount-a.amount});tips.push({icon:"\ud83c\udf7d\ufe0f",title:"Dining: "+fm(dinMo)+"/mo",desc:dinTxns.length+" txns, "+big.length+" over $75."+(big[0]?" Biggest: "+big[0].description.slice(0,25)+" ("+fm(big[0].amount)+")":""),sav:dinMo*.2})}}

    var delTxns=allExp.filter(function(t){return t.category==="Food Delivery"});
    if(delTxns.length>0){var delMo=delTxns.reduce(function(s,t){return s+t.amount},0)/numMoI;if(delMo>30)tips.push({icon:"\ud83d\udeb4",title:"Delivery: "+fm(delMo)+"/mo",desc:"Pickup or cooking saves 30-40%.",sav:delMo*.35})}

    var aiSubs=recur.filter(function(r){return/ANTHROPIC|OPENAI|CHATGPT/i.test(r.name)});
    if(aiSubs.length>=2){var aiT=aiSubs.reduce(function(s,r){return s+r.avg},0);tips.push({icon:"\ud83e\udd16",title:"Multiple AI Subs: "+fm(aiT)+"/mo",desc:aiSubs.map(function(r){return r.name}).join(" + ")+". Need both?",sav:aiT*.5})}

    var totalSav=tips.reduce(function(s,t){return s+(t.sav||0)},0);
    if(totalSav>0){h+='<div style="background:#0c1f16;border:1px solid #22c55e33;border-radius:8px;padding:12px;margin-bottom:14px"><span style="font-size:13px;color:#4ade80;font-weight:600">Potential: up to '+fm(totalSav)+'/mo ('+fm(totalSav*12)+'/yr)</span></div>'}
    if(tips.length===0){h+='<div style="color:#4ade80;font-size:13px">Spending looks well-optimized.</div>'}
    else{tips.forEach(function(tip){h+='<div style="border:1px solid #1a2236;border-radius:8px;padding:12px;margin-bottom:8px;background:#0a1020"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:16px">'+tip.icon+'</span><span style="font-size:13px;font-weight:600;color:#eef1f6">'+tip.title+'</span>'+(tip.sav>0?'<span class="m" style="font-size:11px;color:#4ade80;margin-left:auto">~'+fm(tip.sav)+'/mo</span>':'')+'</div><div style="font-size:12px;color:#8896ab;line-height:1.5">'+tip.desc+'</div></div>'})}
    h+='</div>';

    // Monthly Averages
    h+='<div class="c"><div class="ct">\ud83c\udfaf Monthly Averages</div>';
    var catAvg={};
    allExp.forEach(function(t){catAvg[t.category]=(catAvg[t.category]||0)+t.amount});
    var caList=Object.entries(catAvg).map(function(e){return{cat:e[0],avg:e[1]/numMoI}}).sort(function(a,b){return b.avg-a.avg});
    var caMax=caList[0]?caList[0].avg:1;
    caList.forEach(function(c2){var col=CC[c2.cat]||"#7f8c8d";h+='<div class="br"><div class="bl">'+c2.cat+'</div><div class="bt"><div class="bf" style="width:'+(c2.avg/caMax*100).toFixed(1)+'%;background:'+col+'"></div></div><div class="ba">'+fm(c2.avg)+'</div><div class="bp2">/mo</div></div>'});
    h+='</div>';
  }

  app.innerHTML=h;
}

// ─── RULE FUNCTIONS ───
function addManualRule(){
  var p=document.getElementById("rp").value.trim();
  var c=document.getElementById("rc").value.trim();
  if(!p){alert("Enter a merchant keyword");return}
  if(!c){alert("Enter or select a category");return}
  if(ALLC.indexOf(c)===-1){ALLC.push(c);var hues=["#e74c3c","#3498db","#2ecc71","#f39c12","#9b59b6","#1abc9c","#e67e22","#00bcd4","#ff5722","#607d8b"];CC[c]=hues[ALLC.length%hues.length];saveCustomCats()}
  addRule(p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),c);render();
}
function delRule(i){removeRule(i);render()}
function reapplyRules(){
  var count=0;
  for(var i=0;i<T.length;i++){var nc=cat(T[i].description);if(nc!==T[i].category){T[i].category=nc;count++}}
  save();render();
  document.getElementById("toast").innerHTML='<div class="toast" style="background:#0c152e;border-color:#38bdf844"><div class="toastt" style="color:#38bdf8">Rules Applied</div><div style="font-size:12px;color:#8896ab">Updated '+count+' transactions.</div><button class="b bo" style="margin-top:8px;font-size:11px" onclick="document.getElementById(\'toast\').innerHTML=\'\'">Dismiss</button></div>';
}

// ─── INVESTMENT UPDATE FUNCTIONS ───
function updateFX(){
  var H=loadHoldings();
  var val=parseFloat(document.getElementById("hfx").value);
  if(isNaN(val)||val<1)return;
  H.fx_rate=val;H.as_of=new Date().toISOString().slice(0,10);
  saveHoldings(H);render();
}
function updateHoldings(){
  var H=loadHoldings();
  var active=H.accounts.filter(function(a){return a.total_market>0});
  for(var i=0;i<active.length;i++){
    var el=document.getElementById("hmv"+i);
    if(el){var v=parseFloat(el.value);if(!isNaN(v))active[i].total_market=v}
  }
  var fxEl=document.getElementById("hfx");
  if(fxEl){var fv=parseFloat(fxEl.value);if(!isNaN(fv)&&fv>=1)H.fx_rate=fv}
  H.as_of=new Date().toISOString().slice(0,10);
  saveHoldings(H);render();
  document.getElementById("toast").innerHTML='<div class="toast"><div class="toastt">Holdings Updated</div><div style="font-size:12px;color:#86efac">Portfolio values saved.</div><button class="b bo" style="margin-top:8px;font-size:11px" onclick="document.getElementById(\'toast\').innerHTML=\'\'">OK</button></div>';
}

// ─── INIT ───
loadCustomCats();
loadBudgets();
loadFcst();
loadMbud();
load();
// Seed snapshot if fewer than 2 exist
var _initSnaps=loadSnapshots();
if(_initSnaps.length<2){
  var _H=loadHoldings();var _fxr=_H.fx_rate||1.3822;var _tot=0;
  _H.accounts.forEach(function(a){_tot+=a.total_market*(a.currency==="USD"?_fxr:1)});
  saveSnapshot(_tot,_fxr);
  console.log("Seeded snapshot #"+(_initSnaps.length+1)+": $"+_tot.toFixed(2));
}
render();
// Start auto-refresh if API key exists
if(getFinnhubKey()){
  startAutoRefresh();
  // Immediate refresh on page load
  setTimeout(function(){fetchLivePrices()},1000);
}
document.getElementById("fi").addEventListener("change",function(e){handleFiles(e.target.files)});
</script>
